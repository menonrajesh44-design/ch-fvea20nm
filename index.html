<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club House</title>
<meta name="description" content="Gold Petal Club House (phone)">
<meta name="theme-color" content="#12151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Club House">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
@font-face{font-family:'Chakra Petch';font-weight:600;font-display:swap;src:url(fonts/ChakraPetch-600-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:700;font-display:swap;src:url(fonts/ChakraPetch-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(fonts/IBMPlexMono-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/IBMPlexMono-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400 600;font-display:swap;src:url(fonts/IBMPlexSans-400_600-normal.woff2) format('woff2')}
/* Old Colours palette (same :root values as the Mac Club House) */
:root{
  --bg:#12151B;--panel:#1A1F28;--panel-2:#222935;--line:#2E3644;--fg:#E9EDF3;--muted:#98A3B4;
  --orange:#FF7A1A;--orange-soft:#FFB070;--cyan:#6FE7FF;--on-orange:#1A0E04;
  --font-display:'Chakra Petch',-apple-system,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --font-body:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px)
          calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 14px);
  min-height:100vh;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
header img{width:44px;height:44px;border-radius:11px;border:1px solid var(--line)}
header h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:.4px;line-height:1.1}
header .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--orange)}
.home{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--orange);border-radius:12px;
  background:rgba(255,122,26,.08);margin-bottom:16px}
.home .b{width:30px;height:30px;border-radius:8px;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;font-weight:700}
.home b{font-family:var(--font-display);font-size:17px}
.home small{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.label{font-family:var(--font-mono);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 4px 10px;display:flex;justify-content:space-between}
.label span:last-child{color:var(--cyan);letter-spacing:.6px;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;align-items:center;gap:10px;min-height:68px;padding:12px 10px 12px 11px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--fg);text-decoration:none}
.tile:active{background:var(--panel-2);border-color:var(--orange);transform:scale(.985)}
.badge{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.3px}
.txt{min-width:0;display:flex;flex-direction:column}
.txt b{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt small{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  color:var(--cyan);background:rgba(111,231,255,.07);border:1px solid rgba(111,231,255,.22)}
.meter:active{background:rgba(111,231,255,.2)}
.meter svg{width:17px;height:17px}
.tile.has-meter .txt small{padding-right:30px}
.txt{flex:1}
.hint{margin:16px 4px 0;font-size:12.5px;color:var(--muted)}
.hint svg{width:13px;height:13px;vertical-align:-2px;color:var(--cyan)}
footer{margin:22px 0 4px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:1.2px;color:var(--muted)}
footer span{color:var(--orange)}
.off{display:none;margin:0 0 12px;padding:8px 12px;border-radius:10px;border:1px solid #FFD166;color:#FFD166;font-size:12.5px}
body.offline .off{display:block}
</style>
</head>
<body>
<header>
  <img src="apple-touch-icon.png" alt="">
  <div><h1>Gold Petal</h1><div class="sub">Atelier · Club House</div></div>
</header>

<div class="home"><span class="b">✦</span><b>Club House</b><small>phone</small></div>
<div class="off">You're offline. Club House is ready, but the AI sites need internet.</div>

<p class="label"><span>AI Windows</span><span id="count"></span></p>
<ul class="grid" id="grid"></ul>

<p class="hint">Tap a tile to open it. If the app is on your phone, it opens there. <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg> opens that service's usage and billing page.</p>

<footer><span>Gold Petal</span> · Club House (phone)</footer>

<script>
// Same order, URLs, badges and colours as the "AI WINDOWS" list.
const TABS = [
  {name:"Grok",               url:"https://grok.com/",                       badge:"X",  color:"#C9D1D9", meter:"https://grok.com/?_s=billing"},
  {name:"ChatGPT",            url:"https://chatgpt.com/",                    badge:"G",  color:"#10A37F", meter:"https://chatgpt.com/#settings"},
  {name:"Codex",              url:"https://chatgpt.com/codex/cloud",         badge:">_", color:"#7FF2FF", meter:"https://chatgpt.com/codex/settings/usage"},
  {name:"Gemini",             url:"https://gemini.google.com/",              badge:"✧",  color:"#4D7CFF", meter:"https://one.google.com/"},
  {name:"Claude",             url:"https://claude.ai/",                      badge:"C",  color:"#D97757", meter:"https://claude.ai/settings/usage"},
  {name:"Runway",             url:"https://app.runwayml.com/",               badge:"R",  color:"#F5C518", meter:"https://app.runwayml.com/settings/billing"},
  {name:"ElevenLabs",         url:"https://elevenlabs.io/app",               badge:"11", color:"#FF5C9A", meter:"https://elevenlabs.io/app/subscription"},
  {name:"Perplexity",         url:"https://www.perplexity.ai/",              badge:"P",  color:"#20B8CD", meter:"https://www.perplexity.ai/settings/account"},
  {name:"Copilot",            url:"https://copilot.microsoft.com/",          badge:"Co", color:"#2F6FDB", meter:"https://account.microsoft.com/services"},
  {name:"Wikipedia",          url:"https://en.wikipedia.org/wiki/Main_Page", badge:"W",  color:"#EAECF0"},
  {name:"Flow (Veo 3.1)",     url:"https://labs.google/fx/tools/flow",       badge:"F",  color:"#C08BFF", meter:"https://one.google.com/"},
  {name:"AI Studio (Google)", url:"https://aistudio.google.com/",            badge:"A",  color:"#E07A5F", meter:"https://aistudio.google.com/usage"},
  {name:"CapCut",             url:"https://www.capcut.com/editor",           badge:"Cc", color:"#F2F2F2"},
  {name:"InShot",             url:"https://inshot.com/",                     badge:"In", color:"#FF4F6D"}
];
const GAUGE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>';
function ink(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>160?'#111418':'#FFFFFF';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const grid=document.getElementById('grid');
grid.innerHTML=TABS.map(t=>{
  const host=new URL(t.url).hostname.replace(/^(www|en)\./,'');
  return `<li style="position:relative"><a class="tile${t.meter?' has-meter':''}" href="${esc(t.url)}" target="_blank" rel="noopener">
    <span class="badge" style="background:${t.color};color:${ink(t.color)}">${esc(t.badge)}</span>
    <span class="txt"><b>${esc(t.name)}</b><small>${esc(host)}</small></span></a>
    ${t.meter?`<a class="meter" href="${esc(t.meter)}" target="_blank" rel="noopener" aria-label="${esc(t.name)} usage and billing">${GAUGE}</a>`:''}</li>`;
}).join('');
document.getElementById('count').textContent=TABS.length+' shops';
function net(){document.body.classList.toggle('offline',!navigator.onLine);}
addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
