<!doctype html><html lang="en"><head><title>Steam room · Club House</title><meta name="theme-color" content="#1A1210">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=7">
<link rel="icon" type="image/png" href="favicon.png?v=7">
<style>
@font-face{font-family:'Chakra Petch';font-weight:700;font-display:swap;src:url(fonts/ChakraPetch-700-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-weight:600;font-display:swap;src:url(fonts/ChakraPetch-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/IBMPlexMono-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400 600;font-display:swap;src:url(fonts/IBMPlexSans-400_600-normal.woff2) format('woff2')}
:root{--fg:#F2EEE9;--muted:#A79F98;--gold:#E8B86A;--orange:#FF7A1A;--red:#FF3B4E;--cyan:#6FE7FF;
 --display:'Chakra Petch',-apple-system,system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--body:'IBM Plex Sans',-apple-system,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a,button,.key,.chip{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;color:var(--fg);font-family:var(--body)}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 12px)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 8px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(20,16,22,.7);color:var(--fg);text-decoration:none;font-weight:600;font-size:15px}
.back svg{width:20px;height:20px}
.bar h1{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:19px;letter-spacing:.3px;flex:1;min-width:0}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
</style>
<style>
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(#2A1C16,#1A1210 55%,#120C0A)}
.room{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0 0 34% 0;background:repeating-linear-gradient(90deg,#3B281E 0 46px,#33221A 46px 48px),linear-gradient(#3B281E,#2A1C16);opacity:.9}
.wall:after{content:"";position:absolute;inset:0;background:radial-gradient(50% 60% at 50% 30%,rgba(255,190,120,.28),transparent 70%)}
.lamp{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#FFD9A8;box-shadow:0 0 30px 12px rgba(255,170,90,.45),0 0 120px 50px rgba(255,140,60,.15)}
.bench{position:absolute;left:0;right:0;height:9%;background:linear-gradient(#7A5236,#4E331F);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.bench.b1{bottom:34%}.bench.b2{bottom:14%;height:10%}
.floor{position:absolute;left:0;right:0;bottom:0;height:14%;background:repeating-linear-gradient(90deg,#2B1D16 0 60px,#251812 60px 62px)}
.stones{position:absolute;right:6%;bottom:14%;width:96px;height:70px;border-radius:12px 12px 4px 4px;background:linear-gradient(#3A3A3A,#1C1C1C);box-shadow:0 0 30px rgba(255,90,30,.35)}
.stones i{position:absolute;bottom:52px;width:22px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8A8A8A,#3A3A3A)}
.stones i:nth-child(1){left:8px}.stones i:nth-child(2){left:30px;bottom:56px}.stones i:nth-child(3){left:54px}.stones i:nth-child(4){left:20px;bottom:62px}.stones i:nth-child(5){left:44px;bottom:64px}
.steam{position:absolute;inset:0;pointer-events:none}
.puff{position:absolute;bottom:-20%;width:46vmax;height:46vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,0));filter:blur(18px);animation:rise var(--t) linear var(--d) infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translate(var(--x),-120vh) scale(1.4);opacity:0}}
.ui{position:relative;z-index:5;height:100%;display:flex;flex-direction:column}
.crew{position:absolute;left:0;right:0;display:flex;justify-content:space-evenly;padding:0 4%}
.crew.c1{bottom:calc(34% + 9% - 6px)}.crew.c2{bottom:calc(14% + 10% - 6px)}
.guy{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:0;color:var(--fg);animation:bob var(--t) ease-in-out var(--d) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.guy img,.guy em{width:clamp(52px,15vw,84px);height:clamp(52px,15vw,84px);border-radius:50%;object-fit:cover;border:2px solid rgba(255,220,180,.5);box-shadow:0 6px 14px rgba(0,0,0,.5);background:#3a2a22;display:grid;place-items:center;font:700 22px var(--display);font-style:normal}
.guy b{font:700 12px var(--display);text-shadow:0 1px 3px #000}
.guy .z{font-size:12px;opacity:.85}
.panel{margin-top:auto;position:relative;z-index:6;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
.panel button{height:48px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,220,180,.35);background:rgba(30,20,16,.75);color:#FFE7CC;font:600 14px var(--body);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel button.on{background:rgba(232,184,106,.3);border-color:var(--gold)}
.mood{text-align:center;font:500 13px var(--mono);color:#E9CFAE;margin:4px 0 0;text-shadow:0 1px 4px #000;min-height:18px}
.bar{background:none}
.temp{font:600 12px var(--mono);color:#FFC48A}
</style></head><body>
<div class="room" aria-hidden="true"><div class="wall"></div><div class="lamp"></div><div class="bench b1"></div><div class="bench b2"></div><div class="floor"></div><div class="stones"><i></i><i></i><i></i><i></i><i></i></div><div class="steam" id="steam"></div></div>
<div class="ui"><div class="wrap" style="width:100%">
 <div class="bar"><a class="back" href="index.html" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Club House</a><h1>Steam room</h1><span class="temp" id="temp">48°C</span><span class="clock" id="clock">00:00</span></div>
 <p class="mood" id="mood">Chill. No work talk in here.</p>
</div>
<div class="crew c1" id="c1"></div><div class="crew c2" id="c2"></div>
<div class="panel"><button type="button" id="ladle">💧 Water on stones</button><button type="button" id="sound">🔈 Steam sound</button></div>
</div>
<script>
(function(){'use strict';
var $=function(i){return document.getElementById(i)};
var CREW=[['ralph','Ralph'],['millie','Millie'],['miranda','Miranda'],['alexa','Alexa'],['jack','Jack'],['priya','Priya'],['orange','Orange'],['metaads','Meta Ads'],['amra','Amra'],['mellow','Mellow']];
var MOODS=['Chill. No work talk in here.','Ralph is half asleep.','Millie hums something.','Miranda: “Five more minutes.”','Jack stretches.','Alexa counts the steam clouds.','Deep breath in… and out.','Mellow taps the bench.'];
function guy(c,i){return '<button type="button" class="guy" data-n="'+c[1]+'" style="--t:'+(4+i%3)+'s;--d:-'+i+'s"><img src="bots/'+c[0]+'.jpg" alt=""><b>'+c[1]+'</b><span class="z">'+(i%3===0?'💤':'♨︎')+'</span></button>';}
$('c1').innerHTML=CREW.slice(0,5).map(guy).join('');$('c2').innerHTML=CREW.slice(5).map(function(c,i){return guy(c,i+5)}).join('');
// steam
var st=$('steam');function puff(n,fast){for(var i=0;i<n;i++){var p=document.createElement('i');p.className='puff';p.style.left=(Math.random()*90-20)+'%';p.style.setProperty('--t',(fast?6:12+Math.random()*10)+'s');p.style.setProperty('--d',(fast?0:-Math.random()*20)+'s');p.style.setProperty('--x',(Math.random()*30-15)+'vw');st.appendChild(p);if(fast)setTimeout(function(x){return function(){x.remove()}}(p),6000);}}
puff(9);
var temp=48;function setT(){$('temp').textContent=temp+'°C';}
$('ladle').onclick=function(){puff(6,true);temp=Math.min(60,temp+2);setT();hiss();if(navigator.vibrate)navigator.vibrate(20);$('mood').textContent='Tssss… ♨︎';setTimeout(function(){temp=Math.max(48,temp-1);setT();},8000);};
document.addEventListener('click',function(e){var g=e.target.closest('.guy');if(g)$('mood').textContent=g.dataset.n+' nods. 🙂';});
setInterval(function(){$('mood').textContent=MOODS[Math.floor(Math.random()*MOODS.length)];},9000);
// soft steam / brown-noise sound (made on the phone, no download)
var ac=null,src=null,gain=null;
function ctx(){if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();}if(ac.state==='suspended')ac.resume();return ac;}
function noise(sec){var c=ctx();var n=c.sampleRate*sec,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0),last=0;for(var i=0;i<n;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}return b;}
$('sound').onclick=function(){var c=ctx();if(!c)return;if(src){src.stop();src=null;this.classList.remove('on');this.textContent='🔈 Steam sound';return;}
 src=c.createBufferSource();src.buffer=noise(4);src.loop=true;gain=c.createGain();gain.gain.value=.35;src.connect(gain).connect(c.destination);src.start();this.classList.add('on');this.textContent='🔊 Steam sound';};
function hiss(){var c=ctx();if(!c)return;var s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();var n=c.sampleRate*1.5,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);s.buffer=b;f.type='highpass';f.frequency.value=2500;g.gain.value=.15;s.connect(f).connect(g).connect(c.destination);s.start();}
var t0=Date.now();setInterval(function(){var s=Math.floor((Date.now()-t0)/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
$('back').addEventListener('click',function(e){if(src){src.stop();src=null;}if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back();}});
addEventListener('pagehide',function(){if(src){src.stop();src=null;}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10',{updateViaCache:'none'}).catch(function(){});
})();
</script></body></html>
